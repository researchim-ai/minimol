experiment: reg_smoke
model:
  preset: "5m"
  rc_augment: false
  overrides:
    channels: 32
    n_blocks: 2
    dropout: 0.0
train:
  seed: 7
  batch_size_per_gpu: 16
  epochs: 1
  max_steps: 3
  lr: 0.0003
  weight_decay: 0.0
  early_stopping_patience: 3
  grad_clip: 1.0
  precision: fp32
loss:
  delta: 1.0
data:
  path: data/processed/reg_sample/data.parquet
