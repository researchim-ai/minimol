experiment: cds_30m
model:
  preset: "30m"
  param_budget: 30000000
train:
  seed: 42
  batch_size_per_gpu: 2
  epochs: 20
  lr: 0.0002
  weight_decay: 0.01
  early_stopping_patience: 7
  grad_clip: 1.0
  precision: bf16
loss:
  lambda_gt: 1.0
  lambda_kd: 0.25
  temperature: 1.0
  scale_by_t2: false
data:
  path: data/processed/cds_sample/data.parquet
